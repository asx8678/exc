name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Python lint + test ──────────────────────────────────────────────────────

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check code_puppy tests scripts

      - name: Test (pytest)
        run: uv run pytest tests

      - name: Python package artifact smoke
        # Build wheel, install in temp venv, verify entry points work.
        # Lightweight (uv build + install + --help checks, ~15s).
        # Runs on every PR/main push to catch packaging regressions early.
        run: ./scripts/python-package-smoke.sh

  # ── Elixir format + compile + test ───────────────────────────────────────

  elixir-quality:
    name: Elixir format, compile & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: beam-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            beam-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  # ── Elixir smoke + packaged escript ──────────────────────────────────────

  elixir-smoke:
    name: Elixir smoke & packaged CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: beam-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            beam-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile project
        run: mix compile

      - name: Run mix pup_ex.smoke
        run: mix pup_ex.smoke

      - name: Run no-Python smoke (validates Python-free runtime)
        run: mix pup_ex.smoke --no-python --phase parser --phase run_mode --phase sandbox --phase one_shot

      - name: Build escript and run packaged CLI smoke
        run: ./scripts/smoke-packaged.sh --no-python

  # ── Burrito native binary smoke ────────────────────────────────────────
  # Builds the host Burrito binary and validates the native Elixir runtime
  # in a Python-free environment (PUP_RUNTIME=elixir, sanitized env).
  # This is the CI gate for the native cutover guarantee.
  # Refs: code-puppy-7st, code-puppy-v2o

  burrito-native-smoke:
    name: Burrito native smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils

      # ── Install Zig ─────────────────────────────────────────────────
      # Burrito 1.5.0 requires EXACTLY Zig 0.15.2. It calls exit(1) on
      # version mismatch. Pin precisely to avoid CI flakiness from Zig
      # breaking changes (every 0.x.y has historically broken Burrito).
      # Refs: bd memory "burrito-build-requirements"

      - name: Install Zig 0.15.2
        run: |
          ZIG_VERSION="0.15.2"
          ZIG_TARBALL="zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}" -o /tmp/${ZIG_TARBALL}
          tar -xJf /tmp/${ZIG_TARBALL} -C /tmp/
          echo "/tmp/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Verify Zig version
        run: zig version

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: beam-burrito-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            beam-burrito-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Build Burrito host binary
        run: ./scripts/build-burrito.sh --host-only

      - name: Run Burrito native smoke
        run: ./scripts/smoke-burrito-native.sh
