name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Python lint + test ──────────────────────────────────────────────────────

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check code_puppy tests scripts

      - name: Test (pytest)
        run: uv run pytest tests

      - name: Python package artifact smoke
        # Build wheel, install in temp venv, verify entry points work.
        # Lightweight (uv build + install + --help checks, ~15s).
        # Runs on every PR/main push to catch packaging regressions early.
        run: ./scripts/python-package-smoke.sh

  # ── Elixir format + compile + test ───────────────────────────────────────

  elixir-quality:
    name: Elixir format, compile & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir/code_puppy_control

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            elixir/code_puppy_control/deps
            elixir/code_puppy_control/_build
          key: beam-${{ runner.os }}-${{ hashFiles('elixir/code_puppy_control/mix.lock') }}
          restore-keys: |
            beam-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  # ── Elixir smoke + packaged escript ──────────────────────────────────────

  elixir-smoke:
    name: Elixir smoke & packaged CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir/code_puppy_control

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            elixir/code_puppy_control/deps
            elixir/code_puppy_control/_build
          key: beam-${{ runner.os }}-${{ hashFiles('elixir/code_puppy_control/mix.lock') }}
          restore-keys: |
            beam-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile project
        run: mix compile

      - name: Run mix pup_ex.smoke
        run: mix pup_ex.smoke

      - name: Build escript and run packaged CLI smoke
        run: ./scripts/smoke-packaged.sh
