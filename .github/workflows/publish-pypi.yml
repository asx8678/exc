name: Publish to PyPI (codepp)

on:
  push:
    tags:
      - "codepp/*"

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: true

# OIDC Trusted Publishing — PyPI requires id-token: write and a named
# environment that matches the trusted publisher config on pypi.org.
# The `pypi` environment must be created in the GitHub repo settings
# (Settings → Environments → New environment → "pypi").  No secrets
# are needed; the OIDC token is issued automatically on each run.
permissions:
  contents: read
  id-token: write

# ── Quality gates → build → publish ────────────────────────────────────────
#
# Triggered ONLY on `codepp/*` tags (e.g. codepp/0.0.456).
# The `v*` tag namespace is reserved for Burrito/Elixir releases.
#
# Tag version must match [project].version in pyproject.toml exactly;
# a mismatch fails the run before anything is published.

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-pypi-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-pypi-${{ runner.os }}-

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check code_puppy tests scripts

      - name: Test (pytest — full Python test suite)
        run: uv run pytest tests -q

      - name: Python package artifact smoke
        run: ./scripts/python-package-smoke.sh

  publish:
    name: Build & publish to PyPI
    needs: quality
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validate tag version matches pyproject.toml
        run: |
          set -euo pipefail
          # Extract version suffix from tag: codepp/0.0.456 → 0.0.456
          TAG_VERSION="${GITHUB_REF_NAME#codepp/}"

          if [[ -z "${TAG_VERSION}" ]]; then
            echo "::error::Could not extract version from tag ref '${GITHUB_REF_NAME}'"
            exit 1
          fi

          # Read [project].version from pyproject.toml
          PYPROJECT_VERSION="$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"

          echo "Tag version:      ${TAG_VERSION}"
          echo "pyproject.toml:   ${PYPROJECT_VERSION}"

          if [[ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ]]; then
            echo "::error::Version mismatch: tag '${TAG_VERSION}' != pyproject.toml '${PYPROJECT_VERSION}'"
            echo "Either re-tag as codepp/${PYPROJECT_VERSION} or update pyproject.toml version."
            exit 1
          fi

          echo "✅ Version match confirmed: ${TAG_VERSION}"

      - name: Build sdist and wheel
        run: uv build --sdist --wheel

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
